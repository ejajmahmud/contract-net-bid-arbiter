[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-net-bid-arbiter"
version = "0.1.0"
description = "Formal contract net protocol auction arbiter computing combinatorial task bids and optimal agent allocations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
contract-net-bid-arbiter = "contract_net_bid_arbiter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contract_net_bid_arbiter*"]
